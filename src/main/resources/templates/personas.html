<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('personas')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Customer Personas', 'K-Means behavioral segments')}"></div>
        <div class="p-4">
            <div class="row g-4">
                <div class="col-lg-6" th:each="entry : ${personaMetrics}">
                    <div class="card card-soft p-4 h-100">
                        <h4 th:text="${entry.key}">Persona</h4>
                        <p class="mb-1"><strong>Customers:</strong> <span th:text="${entry.value.count}"></span></p>
                        <p class="mb-1"><strong>Churn Rate:</strong> <span th:text="${#numbers.formatDecimal(entry.value.churnRate,1,2)} + '%'">0%</span></p>
                        <p class="mb-1"><strong>Average Tenure:</strong> <span th:text="${#numbers.formatDecimal(entry.value.averageTenure,1,1)} + ' months'"></span></p>
                        <p class="mb-1"><strong>Average Monthly Charges:</strong> <span th:text="${'₹' + #numbers.formatDecimal(entry.value.averageMonthlyCharges,1,2)}"></span></p>
                        <p class="mb-0">Recommended Action: Focus on loyalty and upselling.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
