<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Customer Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('customers')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Customer Overview', 'Detailed subscriber view and recommendation panel')}"></div>
        <div class="p-4">
            <div class="card card-soft p-4">
                <h4 th:text="${customer.customerId}">Customer</h4>
                <div class="row g-3 mt-2">
                    <div class="col-md-3"><strong>Gender</strong><div th:text="${customer.gender}"></div></div>
                    <div class="col-md-3"><strong>Senior Citizen</strong><div th:text="${customer.seniorCitizen}"></div></div>
                    <div class="col-md-3"><strong>Partner</strong><div th:text="${customer.partner}"></div></div>
                    <div class="col-md-3"><strong>Dependents</strong><div th:text="${customer.dependents}"></div></div>
                    <div class="col-md-3"><strong>Tenure</strong><div th:text="${customer.tenure + ' months'}"></div></div>
                    <div class="col-md-3"><strong>Contract</strong><div th:text="${customer.contract}"></div></div>
                    <div class="col-md-3"><strong>Internet Service</strong><div th:text="${customer.internetService}"></div></div>
                    <div class="col-md-3"><strong>Payment Method</strong><div th:text="${customer.paymentMethod}"></div></div>
                    <div class="col-md-3"><strong>Monthly Charges</strong><div th:text="${'₹' + customer.monthlyCharges}"></div></div>
                    <div class="col-md-3"><strong>Total Charges</strong><div th:text="${'₹' + customer.totalCharges}"></div></div>
                    <div class="col-md-3"><strong>Churn Status</strong><div th:text="${customer.churn}"></div></div>
                    <div class="col-md-3"><strong>Risk Level</strong><div th:text="${customer.riskLevel}"></div></div>
                </div>
                <div class="mt-4">
                    <h5>Recommendations</h5>
                    <ul>
                        <li>Contract Upgrade Offer</li>
                        <li>Technical Support Assistance</li>
                        <li>Discount / Pricing Review</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
