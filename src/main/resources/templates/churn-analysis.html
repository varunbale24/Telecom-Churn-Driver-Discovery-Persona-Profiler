<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Churn Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('churn-analysis')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Churn Analytics', 'Driver analysis by contract, tenure, and service mix')}"></div>
        <div class="p-4">
            <div class="card card-soft p-3 mb-4">
                <h5>Overall Churn Rate</h5>
                <div class="metric-value" th:text="${#numbers.formatDecimal(overallRate, 1, 2)} + '%'">0%</div>
            </div>
            <div class="row g-4">
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Contract Churn</h5><div style="height:260px"><canvas data-chart="bar" th:attr="data-labels=${contractChart}"></canvas></div></div></div>
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Internet Service Churn</h5><div style="height:260px"><canvas data-chart="bar" th:attr="data-labels=${internetChart}"></canvas></div></div></div>
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Payment Method Churn</h5><div style="height:260px"><canvas data-chart="bar" th:attr="data-labels=${paymentChart}"></canvas></div></div></div>
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Tenure Bands</h5><div style="height:260px"><canvas data-chart="bar" data-labels='{"0-12":0,"12-24":0,"24-48":0,"48+":0}'></canvas></div></div></div>
                <div class="col-lg-12"><div class="card card-soft p-3 h-100"><h5>Business Insight</h5><p th:each="insight : ${insights}" th:text="${insight}"></p></div></div>
            </div>
        </div>
    </main>
</div>
<script src="/js/dashboard.js"></script>
</body>
</html>
