<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('prediction')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Churn Prediction', 'Interactive risk assessment form')}"></div>
        <div class="p-4">
            <div class="card card-soft p-4 mb-4">
                <h5>Quick Churn Risk Assessment</h5>
                <form th:action="@{/prediction}" th:object="${predictionRequest}" method="post" class="row g-3">
                    <div class="col-md-6"><label class="form-label">Tenure (months)</label><input type="number" class="form-control" th:field="*{tenure}" required></div>
                    <div class="col-md-6"><label class="form-label">Contract Type</label><select class="form-select" th:field="*{contract}" required><option value="">Select contract...</option><option value="Month-to-month">Month-to-month</option><option value="One year">One year</option><option value="Two year">Two year</option></select></div>
                    <div class="col-md-6"><label class="form-label">Monthly Charges (₹)</label><input type="number" step="0.01" class="form-control" th:field="*{monthlyCharges}" required></div>
                    <div class="col-md-6"><label class="form-label">Internet Service</label><select class="form-select" th:field="*{internetService}" required><option value="">Select service...</option><option value="DSL">DSL</option><option value="Fiber optic">Fiber optic</option><option value="No">No internet</option></select></div>
                    <div class="col-md-12"><label class="form-label">Tech Support</label><select class="form-select" th:field="*{techSupport}" required><option value="">Select option...</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
                    <div class="col-12"><button class="btn btn-primary" type="submit">Predict Churn Risk</button></div>
                </form>
            </div>
            <div class="card card-soft p-4" th:if="${result}">
                <h3>Churn Risk</h3>
                <div class="metric-value" th:text="${#numbers.formatDecimal(result.probability * 100, 1, 0)} + '%'">0%</div>
                <p class="fw-bold" th:text="${result.riskLevel + ' RISK'}">HIGH RISK</p>
                <h5>Why?</h5>
                <ul><li th:each="reason : ${result.reasons}" th:text="${reason}"></li></ul>
                <h5>Recommended Actions</h5>
                <ul><li th:each="action : ${result.recommendations}" th:text="${action}"></li></ul>
            </div>
        </div>
    </main>
</div>
</body>
</html>
