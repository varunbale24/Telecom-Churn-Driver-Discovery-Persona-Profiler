<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('customers')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Customers', 'Search and review telecom subscribers')}"></div>
        <div class="p-4">
            <div class="card card-soft p-3 mb-4">
                <form class="row g-2 align-items-end" method="get" action="/customers">
                    <div class="col-md-3"><label class="form-label">Search</label><input type="text" class="form-control" name="query" th:value="${query}" placeholder="Customer ID, persona, or service"></div>
                    <div class="col-md-2"><label class="form-label">Contract</label><select class="form-select" name="contract"><option value="">All</option><option value="Month-to-month">Month-to-month</option><option value="One year">One year</option><option value="Two year">Two year</option></select></div>
                    <div class="col-md-2"><label class="form-label">Risk</label><select class="form-select" name="riskLevel"><option value="">All</option><option value="LOW">LOW</option><option value="MEDIUM">MEDIUM</option><option value="HIGH">HIGH</option></select></div>
                    <div class="col-md-2"><label class="form-label">Churn</label><select class="form-select" name="churn"><option value="">All</option><option value="No">No</option><option value="Yes">Yes</option></select></div>
                    <div class="col-md-1"><label class="form-label">Rows</label><input type="number" class="form-control" name="size" value="10"></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Apply</button></div>
                </form>
            </div>
            <div class="card card-soft p-3">
                <div class="table-responsive">
                    <table class="table align-middle" id="customerTable">
                        <thead><tr><th>Customer ID</th><th>Tenure</th><th>Contract</th><th>Internet Service</th><th>Monthly Charges</th><th>Churn</th><th>Risk</th><th>Persona</th><th>Action</th></tr></thead>
                        <tbody>
                        <tr th:each="customer : ${customers}">
                            <td th:text="${customer.customerId}"></td>
                            <td th:text="${customer.tenure + ' months'}"></td>
                            <td th:text="${customer.contract}"></td>
                            <td th:text="${customer.internetService}"></td>
                            <td th:text="${'₹' + customer.monthlyCharges}"></td>
                            <td th:text="${customer.churn}"></td>
                            <td><span class="badge" th:classappend="${'badge-risk-' + customer.riskLevel.toLowerCase()}" th:text="${customer.riskLevel}"></span></td>
                            <td th:text="${customer.personaName}"></td>
                            <td><a class="btn btn-sm btn-outline-primary" th:href="@{'/customers/' + ${customer.id}}">View</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
