<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-wrap">
<div class="container py-5">
    <div class="row justify-content-center align-items-center g-0 login-card bg-white">
        <div class="col-lg-5 hero-panel p-5">
            <div class="fs-2 fw-bold mb-3">TeleChurn AI</div>
            <p class="lead">Telecom Intelligence Platform</p>
            <div class="mt-5 fs-5">Predict churn.</div>
            <div class="fs-5">Understand customers.</div>
            <div class="fs-5">Improve retention.</div>
        </div>
        <div class="col-lg-7 p-5">
            <h1 class="h3 fw-bold mb-1">Welcome back</h1>
            <p class="text-muted mb-4">Sign in with your own email and password to access telecom customer intelligence.</p>
            <form th:action="@{/login}" method="post" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control form-control-lg" placeholder="analyst@telechurn.com" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>
                <div class="col-12 d-flex justify-content-between align-items-center">
                    <a href="#" class="text-decoration-none">Forgot Password?</a>
                    <a href="/register" class="text-decoration-none fw-semibold">Create Account</a>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
                </div>
                <div class="col-12 text-danger" th:if="${param.error}">Invalid email or password.</div>
                <div class="col-12 text-success" th:if="${param.logout}">You have been logged out.</div>
                <div class="col-12 text-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
