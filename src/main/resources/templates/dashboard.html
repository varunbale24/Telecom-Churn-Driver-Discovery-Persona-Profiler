<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('dashboard')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Dashboard', 'Customer intelligence and churn overview')}"></div>
        <div class="p-4">
            <div class="row g-3 mb-4">
                <div class="col-md-3"><div class="card card-soft p-3"><div class="text-muted">Total Customers</div><div class="metric-value" th:text="${summary.totalCustomers}">0</div></div></div>
                <div class="col-md-3"><div class="card card-soft p-3"><div class="text-muted">Churned Customers</div><div class="metric-value" th:text="${summary.churnedCustomers}">0</div></div></div>
                <div class="col-md-3"><div class="card card-soft p-3"><div class="text-muted">Churn Rate</div><div class="metric-value" th:text="${#numbers.formatDecimal(summary.churnRate, 1, 2)} + '%'">0%</div></div></div>
                <div class="col-md-3"><div class="card card-soft p-3"><div class="text-muted">High-Risk Customers</div><div class="metric-value" th:text="${summary.highRiskCustomers}">0</div></div></div>
            </div>
            <div class="row g-4 mb-4">
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Churn by Contract</h5><div style="height:280px"><canvas data-chart="bar" th:attr="data-labels=${contractChart}"></canvas></div></div></div>
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Churn by Tenure Band</h5><div style="height:280px"><canvas data-chart="bar" th:attr="data-labels=${tenureChart}"></canvas></div></div></div>
            </div>
            <div class="row g-4">
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Top Churn Drivers</h5><div style="height:280px"><canvas data-chart="bar" th:attr="data-labels=${driverChart}"></canvas></div></div></div>
                <div class="col-lg-6"><div class="card card-soft p-3 h-100"><h5>Retention Insight</h5><p class="mb-2" th:each="insight : ${insights}" th:text="${insight}"></p></div></div>
            </div>
        </div>
    </main>
</div>
<script src="/js/dashboard.js"></script>
</body>
</html>
