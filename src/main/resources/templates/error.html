<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-wrap d-flex align-items-center">
<div class="container">
    <div class="card card-soft p-5 text-center">
        <h1 class="display-6">Something went wrong</h1>
        <p class="text-muted" th:text="${errorMessage}">An unexpected error occurred.</p>
        <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
    </div>
</div>
</body>
</html>
