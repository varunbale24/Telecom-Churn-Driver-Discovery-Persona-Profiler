<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeleChurn AI | Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/nav :: sidebar('reports')}"></div>
    <main class="main-panel">
        <div th:replace="~{fragments/nav :: topbar('Reports', 'Operational summaries and downloadable exports')}"></div>
        <div class="p-4">
            <div class="card card-soft p-4 mb-4"><p th:text="${summary}"></p><p class="text-success" th:if="${generatedMessage}" th:text="${generatedMessage}"></p></div>
            <div class="d-flex gap-2">
                <a class="btn btn-primary" href="/reports/generate">Generate Report</a>
                <a class="btn btn-outline-primary" href="/reports/download">Download CSV</a>
            </div>
            <div class="card card-soft p-4 mt-4">
                <h5>CSV Preview</h5>
                <pre class="mb-0" th:each="line : ${csvPreview}" th:text="${line}"></pre>
            </div>
        </div>
    </main>
</div>
</body>
</html>
